version: 2

models:
  # ==========================================
  # 1. 세수실적 Staging 모델
  # ==========================================
  - name: stg_tax_admin__national_tax
    description: 지역별·세목별·연도별 국세 세수실적 (2020-2024) 정제 모델
    columns:
      - name: tax_revenue_id
        description: 국세 세수실적 고유 식별자 (대체키). 연도, 지방청, 지역 및 세목 계층(1-6단계) 조합에 대한 Hash 값
        data_tests:
          - unique
          - not_null
      - name: tax_year
        description: 세수 발생 연도
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 2020
                  - 2021
                  - 2022
                  - 2023
                  - 2024
                quote: false
      - name: regional_tax_office
        description: 세수 집계 관할 지방국세청
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 서울청
                  - 중부청
                  - 인천청
                  - 대전청
                  - 광주청
                  - 대구청
                  - 부산청       
      - name: region
        description: 세수 집계 지역 구분 (시·도 수준)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 서울
                  - 부산
                  - 대구
                  - 인천
                  - 광주
                  - 대전
                  - 울산
                  - 경기
                  - 강원
                  - 충북
                  - 충남·세종
                  - 전북
                  - 전남
                  - 경북
                  - 경남
                  - 제주
      - name: tax_category_level_1
        description: 국세 세목 계층 1단계 (대분류)
        data_tests:
          - not_null
      - name: tax_category_level_2
        description: 국세 세목 계층 2단계 (중분류)
        data_tests:
          - not_null
      - name: tax_category_level_3
        description: 국세 세목 계층 3단계 (중분류)
        data_tests:
          - not_null
      - name: tax_category_level_4
        description: 국세 세목 계층 4단계 (중분류)
        data_tests:
          - not_null
      - name: tax_category_level_5
        description: 국세 세목 계층 5단계 (중분류)
        data_tests:
          - not_null
      - name: tax_category_level_6
        description: 국세 세목 계층 6단계 (소분류)
        data_tests:
          - not_null
      - name: effective_tax_category_name
        description: 국세 세목 계층(1-6단계) 중 구조적 채움값인 '소계'를 배제하고 추출한 실질적 최하위 세목명 (파생 변수)
        data_tests:
          - not_null 
      - name: tax_amount
        description: "해당 지역·세목·연도 기준 국세 세수액 (단위: 원)"

  - name: stg_tax_admin__local_tax_metro
    description: 지역별(시 단위 광역자치단체)·세목별·연도별 지방세 세수실적 (2020-2024) 정제 모델
    columns:
      - name: tax_revenue_id
        description: 지방세 세수실적 고유 식별자 (대체키). 연도, 지역 및 세목 계층(1-2단계) 조합에 대한 Hash 값
        data_tests:
          - unique
          - not_null
      - name: tax_year
        description: 세수 발생 연도
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 2020
                  - 2021
                  - 2022
                  - 2023
                  - 2024
                quote: false
