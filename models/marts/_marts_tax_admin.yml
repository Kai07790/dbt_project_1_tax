version: 2

models:
  - name: fct_tax_revenue
    description: >
      전국 16개 분석 지역의 국세 및 지방세 세수실적을 통합하여
      tax_year + region + tax_type + tax_name grain으로
      세수액을 제공하는 Fact 모델.
      국세와 지방세는 tax_type으로 구분한다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - region
              - tax_type
              - tax_name
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
      - name: region
        description: 세수 집계 지역명 (충남·세종을 포함한 16개 분석 지역)
      - name: tax_type
        description: 세금 유형 구분 (국세/지방세)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 국세
                  - 지방세
      - name: tax_name
        description: 국세 13개 및 지방세 11개 세목명
      - name: tax_amount
        description: "연도·지역·세금 유형·세목별 세수액 (단위: 원)"
        data_tests:
          - not_null

  - name: rpt_tax_revenue_by_year
    description: >
      전국 16개 분석 지역의 국세·지방세 세수실적을 연도별로 집계하여
      전체 세수액, 지방세 비중 및 전년 대비 비중 변화(%p)를 산출한 Reporting 모델.
      국세 13개·지방세 11개 세목을 대상으로 Q1 분석에 활용한다.
      최종 grain은 tax_year이다.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tax_share_local BETWEEN 0 AND 1"
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
        data_tests:
          - unique
          - not_null
      - name: tax_amount_national
        description: "연도별 국세 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_local
        description: "연도별 지방세 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_total
        description: "연도별 국세·지방세 전체 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_share_local
        description: 전체 세수 대비 지방세 비중 (0-1)
        data_tests:
          - not_null
      - name: tax_share_local_yoy_pp
        description: "지방세 비중의 전년 대비 변화 (단위: %p, 2020년은 NULL)"

  - name: rpt_tax_revenue_by_tax_name
    description: >
      전국 16개 분석 지역의 국세·지방세 세수실적을 세목별로 집계하여
      세수액, 구성비, 세수액 순위, 전년 대비 증감액 및 증감률을 제공하는 Reporting 모델.
      국세 13개·지방세 11개 세목을 대상으로 Q2-1, Q2-2 분석에 활용한다.
      최종 grain은 tax_year + tax_type + tax_name이다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - tax_type
              - tax_name
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
      - name: tax_type
        description: 세금 유형 구분 (국세/지방세)
      - name: tax_name
        description: 세목명 (국세 13개·지방세 11개)
      - name: tax_amount
        description: "연도·세금 유형·세목별 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_share_in_type
        description: 동일 연도·세금 유형의 전체 세수 대비 해당 세목의 세수 비중 (1 = 100%)
        data_tests:
          - not_null
      - name: tax_rank_in_type
        description: >
          동일 연도·세금 유형 내 세목별 세수액의 내림차순 순위
          (동률은 공동순위, RANK 기준)
        data_tests:
          - not_null
      - name: tax_amount_yoy_change
        description: >
          동일 세금 유형·세목의 전년 대비 세수 증감액
          (단위: 원, 2020년은 NULL)
      - name: tax_amount_yoy_change_rate
        description: >
          동일 세금 유형·세목의 전년 대비 세수 증감률
          (1 = 100%, 2020년은 NULL)
