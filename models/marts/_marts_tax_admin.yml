version: 2

models:
  - name: fct_tax_revenue
    description: >
      전국 16개 분석 지역의 국세·지방세 세수실적을 통합하여
      세수액을 제공하는 Fact 모델.
      국세와 지방세는 tax_type으로 구분하며,
      최종 grain은 tax_year + region + tax_name이다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - region
              - tax_name
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
      - name: region
        description: 세수 집계 지역명 (충남·세종을 포함한 16개 분석 지역)
      - name: tax_type
        description: 세금 유형 구분 (국세/지방세)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 국세
                  - 지방세
      - name: tax_name
        description: 세목명 (국세 13개·지방세 11개)
      - name: tax_amount
        description: "연도·지역·세금 유형·세목별 세수액 (단위: 원)"
        data_tests:
          - not_null

  - name: rpt_tax_revenue_by_year
    description: >
      전국 16개 분석 지역의 국세·지방세 세수실적을 연도별로 집계하여
      분석 대상 전체 세수액, 지방세 비중 및 전년 대비 비중 변화(%p)를 산출한 Reporting 모델.
      국세 13개·지방세 11개 세목을 대상으로 Q1 분석에 활용한다.
      최종 grain은 tax_year이다.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tax_share_local BETWEEN 0 AND 1"
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
        data_tests:
          - unique
          - not_null
      - name: tax_amount_national
        description: "연도별 국세 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_local
        description: "연도별 지방세 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_total
        description: "연도별 국세·지방세 전체 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_share_local
        description: 분석 대상 전체 세수 대비 지방세 비중 (0-1)
        data_tests:
          - not_null
      - name: tax_share_local_yoy_pp
        description: "지방세 비중의 전년 대비 변화 (단위: %p, 2020년은 NULL)"

  - name: rpt_tax_revenue_by_tax_name
    description: >
      전국 16개 분석 지역의 국세·지방세 세수실적을 연도·세목별로 집계하여
      세수액, 구성비, 전년 대비 증감액 및 증감률을 제공하는 Reporting 모델.
      국세 13개·지방세 11개 세목을 대상으로 Q2-1, Q2-2 분석에 활용한다.
      최종 grain은 tax_year + tax_name이다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - tax_name
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
      - name: tax_type
        description: 세금 유형 구분 (국세/지방세)
      - name: tax_name
        description: 세목명 (국세 13개·지방세 11개)
      - name: tax_amount
        description: "연도·세금 유형·세목별 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_share_in_type
        description: 동일 연도·세금 유형의 전체 세수 대비 해당 세목의 세수 비중 (1 = 100%)
        data_tests:
          - not_null
      - name: tax_amount_yoy_change
        description: >
          동일 세금 유형·세목의 전년 대비 세수 증감액
          (단위: 원, 2020년은 NULL)
      - name: tax_amount_yoy_change_rate
        description: >
          동일 세금 유형·세목의 전년 대비 세수 증감률
          (1 = 100%, 2020년은 NULL)
      
  - name: rpt_tax_revenue_by_region
    description: >
      전국 16개 분석 지역의 세수실적을 연도·지역별로 집계한 뒤,
      int_tax_admin__population 모델의 인구수 데이터와 결합하여
      수도권 여부, 인구수, 세수액을 제공하는 Reporting 모델.
      국세 13개·지방세 11개 세목의 전체 세수액과 주요 지방세목(취득세·지방소비세)의 세수액을 제공하며, 
      Q3-2 분석에 활용한다.
      최종 grain은 tax_year + region이다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - region
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
      - name: region
        description: 세수 집계 지역명 (충남·세종을 포함한 16개 분석 지역)
      - name: region_type
        description: 수도권(서울·경기·인천)과 비수도권(그 외 13개 분석 지역)을 구분하는 지역 분류
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 수도권
                  - 비수도권
      - name: population_count
        description: "연도·지역별 주민등록 총인구수 (단위: 명)"
        data_tests:
          - not_null
      - name: tax_amount_national
        description: "국세 13개 세목 전체의 연도·지역별 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_local
        description: "지방세 11개 세목 전체의 연도·지역별 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_acquisition
        description: "취득세의 연도·지역별 세수 합계 (단위: 원)"
        data_tests:
          - not_null
      - name: tax_amount_local_consumption
        description: "지방소비세의 연도·지역별 세수 합계 (단위: 원)"
        data_tests:
          - not_null
