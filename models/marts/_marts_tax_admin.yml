version: 2

models:
  - name: fct_tax_revenue
    description: >
      전국 16개 분석 지역의 국세 및 지방세 세수실적을 통합하여
      tax_year + region + tax_type + tax_name grain으로
      세수액을 제공하는 Fact 모델.
      국세와 지방세는 tax_type으로 구분한다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - region
              - tax_type
              - tax_name
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
      - name: region
        description: 세수 집계 지역명 (충남·세종을 포함한 16개 분석 지역)
      - name: tax_type
        description: 세금 유형 구분 (국세/지방세)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 국세
                  - 지방세
      - name: tax_name
        description: 국세 13개 및 지방세 11개 세목명
      - name: tax_amount
        description: "연도·지역·세금 유형·세목별 세수액 (단위: 원)"
        data_tests:
          - not_null
