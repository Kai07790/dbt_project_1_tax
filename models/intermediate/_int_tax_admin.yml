version: 2

models:
  - name: int_tax_admin__local_tax
    description: >
      전국 17개 시·도의 지방세 데이터를 통합하고 분석 대상 세목만 남긴 뒤,
      충남과 세종을 충남·세종으로 표준화하여
      tax_year + region + tax_name grain으로 지방세액을 집계한 모델.
      tax_category_level_1은 동일 세목의 지방자치단체 유형별 구분으로,
      지역별 세목 총액 분석에는 필요하지 않아 grain에서 제외한다.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tax_year
              - region
              - tax_name
    columns:
      - name: tax_year
        description: 세수 발생 연도 (2020-2024)
        data_tests:
          - not_null
      - name: region
        description: 세수 집계 지역명 (충남·세종을 통합한 16개 분석 지역)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 서울
                  - 부산
                  - 대구
                  - 인천
                  - 광주
                  - 대전
                  - 울산
                  - 경기
                  - 강원
                  - 충북
                  - 충남·세종
                  - 전북
                  - 전남
                  - 경북
                  - 경남
                  - 제주
      - name: tax_name
        description: 현행 11개 지방세 세목명 (폐지 및 분석 대상이 아닌 세목 제외)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 취득세
                  - 등록면허세
                  - 레저세
                  - 담배소비세
                  - 지방소비세
                  - 주민세
                  - 지방소득세
                  - 재산세
                  - 자동차세
                  - 지역자원시설세
                  - 지방교육세
      - name: tax_amount
        description: "연도·지역·세목별 지방세 세수액 (단위: 원)"
        data_tests:
          - not_null